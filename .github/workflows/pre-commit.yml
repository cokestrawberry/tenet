name: Pre-commit

on:
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Test evaluation verification
        run: python -B -m unittest discover -s plugins/tenet/evals/tests -v
      - name: Run pre-commit
        run: pre-commit run --all-files
