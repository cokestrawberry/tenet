name: Evaluation verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: Evaluation regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run evaluation regression tests
        run: python -B -m unittest discover -s evals/tests -v
