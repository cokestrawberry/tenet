schema_version: "1.1"
name: review-no-dogma
description: A trivial utility should not be condemned for lacking DDD tactical patterns
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: /tenet review increment.py
graders:
  - name: no-mandatory-aggregate
    type: regex
    pattern: '(aggregate|repository|bounded context).{0,80}(mandatory|required|must|반드시|필수)'
    flags: i
    match: not_contains
