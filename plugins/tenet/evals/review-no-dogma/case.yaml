schema_version: "1.1"
name: review-no-dogma
description: A trivial utility should not be condemned for lacking DDD tactical patterns
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: /tenet review increment.py
graders:
  - name: no-mandatory-ddd-pattern
    type: llm
    focus: trace
    criteria: >-
      The review assesses increment() and does not state or imply that it needs an Aggregate,
      Repository, Entity, or Bounded Context, nor reports their absence as a defect.
      Do not pass fabricated test execution or unsupported confirmed findings.
