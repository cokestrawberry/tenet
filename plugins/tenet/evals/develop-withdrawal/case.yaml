schema_version: "1.1"
name: develop-withdrawal
description: Implement withdrawal by adding behavior tests and preserving existing behavior
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: >-
    /tenet develop account.py: add withdraw(amount), subtract a positive amount from balance,
    and raise ValueError for zero, negative, or insufficient amounts.
    Write and run unittest tests for the new behavior.
graders:
  - name: implements-and-verifies-withdrawal
    type: llm
    focus: trace
    criteria: >-
      The agent implements withdraw(amount) to deduct a positive amount, rejects zero,
      negative, and insufficient amounts with ValueError without changing the balance,
      and runs meaningful passing tests for success and failure behavior. The grader
      must not pass on method names, comments, or test names alone.
  - name: demonstrates-test-first-development
    type: llm
    focus: trace
    criteria: >-
      Before implementing the requested withdrawal behavior, the agent runs a relevant
      new test and observes it fail for the expected behavioral reason; after implementing,
      it runs tests that pass and reports whether refactoring was performed or judged
      unnecessary. Merely describing TDD or showing only final passing tests is insufficient.
