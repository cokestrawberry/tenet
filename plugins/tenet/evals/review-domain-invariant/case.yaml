schema_version: "1.1"
name: review-domain-invariant
description: Detect that a filled order can be cancelled, without editing its source
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: /tenet review order.py
graders:
  - name: identifies-cancelled-filled-order
    type: regex
    pattern: '(FILLED|filled|체결)[\s\S]*(cancel|취소)|(cancel|취소)[\s\S]*(FILLED|filled|체결)'
    flags: i
  - name: identifies-triggering-operation
    type: regex
    pattern: 'cancel\('
